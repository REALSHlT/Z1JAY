<section id="about" class="section-py relative overflow-hidden">
  <!-- Comic decorations -->
  <div class="hidden md:block absolute top-20 right-4 w-60 h-44 halftone-punch opacity-70 rotate-3 pointer-events-none"></div>
  <div class="hidden md:block absolute bottom-16 -left-12 w-40 h-40 bg-volt border-[3px] border-ink rounded-full pointer-events-none"></div>

  <div class="max-w-[1440px] mx-auto px-5 md:px-12 relative">

    <div class="flex items-end gap-4 mb-4" appScrollReveal>
      <span class="brut-label text-punch">05 /</span>
      <h2 class="section-heading !mb-0" appSplitText>關於我</h2>
      <span class="burst burst-acid w-24 h-24 -rotate-12 hidden lg:inline-flex ml-auto -mb-4 !text-[12px]">Hi!</span>
    </div>

    <!-- 開場白 —— 用引號版面拉出份量 -->
    <div class="max-w-3xl mb-12 md:mb-16" appScrollReveal>
      <p class="text-[20px] md:text-[28px] leading-[1.6] font-bold border-l-[6px] border-punch pl-5 md:pl-7">
        {{ intro }}
      </p>
    </div>

    <!-- 故事區塊 —— 交錯排版，避免變成一整片文字牆 -->
    <div class="grid md:grid-cols-2 gap-6 md:gap-8">
      @for (block of story; track block.heading; let i = $index) {
        <article class="brut-card p-6 md:p-8 relative"
                 [class.md:mt-10]="i % 2 === 1"
                 [class.md:-rotate-[0.4deg]]="i % 2 === 0"
                 [class.md:rotate-[0.4deg]]="i % 2 === 1"
                 appScrollReveal
                 [revealClass]="i % 2 === 0 ? 'reveal-left' : 'reveal-right'">

          <div class="flex items-start gap-4 mb-4">
            <div class="w-12 h-12 flex-shrink-0 bg-volt border-[3px] border-ink flex items-center justify-center rotate-3">
              <span class="material-symbols-outlined text-white" style="font-size:24px;" aria-hidden="true">{{ block.icon }}</span>
            </div>
            <h3 class="font-display text-[19px] md:text-[22px] leading-[1.3] pt-1">{{ block.heading }}</h3>
          </div>

          <p class="text-[15px] leading-[1.85] text-on-surface-variant">{{ block.body }}</p>
        </article>
      }
    </div>

  </div>
</section>
