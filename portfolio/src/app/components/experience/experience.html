<section id="experience" class="section-py sec-white relative overflow-hidden">
  <!-- Comic decorations -->
  <div class="hidden md:block absolute top-1/4 right-0 w-[32vw] h-96 hatch hatch-45 hatch-acid hatch-bold hatch-fade pointer-events-none"></div>
  <div class="hidden md:block absolute bottom-10 right-24 w-24 h-24 bg-volt border-[3px] border-ink block-hatched rotate-12 pointer-events-none"></div>

  <div class="edge rule-grid relative">

  <div class="flex flex-wrap items-end gap-x-6 gap-y-1 mb-10 md:mb-14" appScrollReveal>
    <span class="sec-index w-full">06 — 10</span>
    <h2 class="display-bleed !mb-0" appSplitText>經歷</h2>
  </div>

  <div class="flex flex-col gap-8 max-w-4xl">
    <!-- track 用 title 不用 year：2025 有三筆（畢業／兵役／義聖香），year 會撞鍵 -->
    @for (entry of experiences; track entry.title; let i = $index) {
      <div class="brut-card brut-hover grid md:grid-cols-12 gap-4 md:gap-8 p-6 md:p-8 relative"
           [class.md:-rotate-[0.4deg]]="i % 2 === 0"
           [class.md:rotate-[0.4deg]]="i % 2 === 1"
           appScrollReveal [revealClass]="i % 2 === 0 ? 'reveal-left' : 'reveal-right'">

        @if (entry.highlight) {
          <span class="sticker inline-flex bg-punch text-white absolute -top-4 right-6 rotate-2 !text-[10px]">Highlight</span>
        }

        <!-- Giant year + 細部期間 -->
        <div class="md:col-span-3 flex md:flex-col md:items-center items-baseline gap-3 md:gap-1.5">
          <span class="font-display text-[40px] md:text-[56px] leading-none"
                [class.text-punch]="entry.highlight"
                [class.text-stroke]="!entry.highlight">{{ entry.year }}</span>
          @if (entry.period) {
            <span class="brut-label !text-[10px] text-on-surface-variant whitespace-nowrap">{{ entry.period }}</span>
          }
        </div>

        <div class="md:col-span-9">
          <h3 class="font-display text-[20px] md:text-[24px] leading-[1.3]">
            {{ entry.title }}
          </h3>
          <p class="brut-label text-on-surface-variant mt-1.5 normal-case">&#64; {{ entry.org }}</p>
          <p class="text-[15px] leading-[1.8] text-on-surface-variant mt-3">
            {{ entry.description }}
          </p>
        </div>
      </div>
    }
  </div>

  </div>
</section>
