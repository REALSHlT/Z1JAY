<section id="credentials" class="section-py sec-punch-tint relative overflow-hidden">
  <!-- Comic decorations -->
  <div class="hidden md:block absolute -top-6 left-1/3 w-[28vw] h-48 hatch hatch-cross hatch-fine hatch-fade rotate-2 pointer-events-none"></div>

  <div class="edge rule-grid relative">

  <div class="flex flex-wrap items-end gap-x-6 gap-y-1 mb-10 md:mb-14" appScrollReveal>
    <span class="sec-index w-full">09 — 10</span>
    <h2 class="display-bleed !mb-0" appSplitText>資歷</h2>
    <span class="burst burst-acid w-28 h-28 rotate-12 hidden lg:inline-flex ml-auto -mb-4 !text-[11px]">Certified!</span>
  </div>

  <div class="grid grid-cols-1 md:grid-cols-3 gap-10 md:gap-8">
    @for (cert of certs; track cert.number; let i = $index) {
      <div class="bg-white border-[3px] border-ink shadow-brut brut-hover p-3 pb-6 relative"
           [class.md:-rotate-1]="i % 3 === 0"
           [class.md:rotate-1]="i % 3 === 1"
           [class.md:-rotate-[0.5deg]]="i % 3 === 2"
           appScrollReveal [revealDelay]="(i + 1) * 100" revealClass="reveal-scale">

        <!-- Tape -->
        <span class="absolute -top-3 left-1/2 -translate-x-1/2 w-20 h-6 bg-acid/90 border-2 border-ink -rotate-1 z-10"></span>

        <!-- button（不是 div）— 才能用 Tab 聚焦、Enter/Space 開啟 -->
        <button type="button"
                class="cert-img-wrap block w-full h-[230px] border-2 border-ink"
                [attr.aria-label]="'放大檢視：' + cert.alt"
                (click)="openModal(cert, $any($event.currentTarget))">
          <app-img [name]="cert.image" [alt]="cert.alt"
                   sizes="(min-width: 768px) 30vw, 92vw"
                   imgClass="w-full h-full object-cover" />
        </button>
        <div class="px-3 pt-5">
          <h4 class="font-display text-[18px] leading-[1.3] mb-1">{{ cert.title }}</h4>
          <p class="brut-label text-punch">{{ cert.subtitle }}</p>
          <p class="text-[14px] leading-[1.7] text-on-surface-variant mt-2">{{ cert.detail }}</p>
          <p class="font-mono text-[11px] text-on-surface-variant mt-2 tracking-widest uppercase">{{ cert.number }}</p>
        </div>
      </div>
    }
  </div>

  <!-- ══ 平台與互動展示（原「線上展示」區塊併入此處）══ -->
  <div class="mt-16 md:mt-24" appScrollReveal>
    <div class="flex items-end gap-4 mb-6">
      <h3 class="font-display text-[24px] md:text-[32px] leading-none">作品平台</h3>
      <span class="h-[3px] flex-1 bg-ink mb-2"></span>
    </div>

    <div class="flex flex-col sm:flex-row gap-6 mb-12">
      <a [href]="links.platforms.sketchfabProfile" target="_blank" rel="noopener noreferrer"
         class="group brut-card brut-hover flex items-center gap-4 px-6 py-5 w-full sm:w-auto -rotate-1">
        <div class="w-12 h-12 bg-volt border-[3px] border-ink flex items-center justify-center flex-shrink-0">
          <span class="material-symbols-outlined text-white" style="font-size:24px;" aria-hidden="true">view_in_ar</span>
        </div>
        <div class="min-w-0">
          <div class="font-display text-[16px]">Sketchfab</div>
          <div class="brut-label text-on-surface-variant truncate mt-0.5 normal-case">z1jay.FollwMyInstagram</div>
        </div>
        <span class="material-symbols-outlined ml-auto flex-shrink-0 group-hover:translate-x-1 group-hover:-translate-y-1 transition-transform" aria-hidden="true">north_east</span>
      </a>

      <a [href]="links.platforms.artstation" target="_blank" rel="noopener noreferrer"
         class="group brut-card brut-hover flex items-center gap-4 px-6 py-5 w-full sm:w-auto rotate-1">
        <div class="w-12 h-12 bg-punch border-[3px] border-ink flex items-center justify-center flex-shrink-0">
          <span class="material-symbols-outlined text-white" style="font-size:24px;" aria-hidden="true">palette</span>
        </div>
        <div class="min-w-0">
          <div class="font-display text-[16px]">ArtStation</div>
          <div class="brut-label text-on-surface-variant truncate mt-0.5 normal-case">z_jay</div>
        </div>
        <span class="material-symbols-outlined ml-auto flex-shrink-0 group-hover:translate-x-1 group-hover:-translate-y-1 transition-transform" aria-hidden="true">north_east</span>
      </a>
    </div>

    <div class="win rotate-[0.4deg]">
      <div class="win-titlebar">
        <span class="dot dot-r"></span><span class="dot dot-y"></span><span class="dot dot-g"></span>
        <span class="ml-2 truncate">sketchfab — 可互動 3D 模型</span>
      </div>
      <div class="w-full" style="aspect-ratio:16/9; min-height:300px;">
        <iframe [src]="sketchfabModelUrl"
                title="Free Rigged Toothless Meme — 3D Model"
                class="w-full h-full border-0"
                allowfullscreen
                loading="lazy"></iframe>
      </div>
    </div>
  </div>

  </div>
</section>
